global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # A3: every replica is scraped DIRECTLY on its own address (never through Envoy).
  # Each replica exposes HTTP *and* gRPC metrics on :8000/metrics (one process); the `replica` label comes from here.
  - job_name: "veritas-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["veritas-a:8000"]
        labels: {service: "veritas-app", replica: "A"}
      - targets: ["veritas-b:8000"]
        labels: {service: "veritas-app", replica: "B"}
      - targets: ["veritas-c:8000"]
        labels: {service: "veritas-app", replica: "C"}

  # A3: Envoy's own metrics (listeners, clusters, health checks).
  - job_name: "envoy"
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]
        labels: {service: "envoy"}

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-system"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
