filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*-json.log'

# ---------------------------------------------------------------------------
# Processors
# ---------------------------------------------------------------------------
processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

  - drop_event:
      when:
        not:
          equals:
            service.name: "veritas-app"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "veritas-logs-%{+yyyy.MM.dd}"

setup.template.name: "veritas-logs"
setup.template.pattern: "veritas-logs-*"
setup.ilm.enabled: false

logging.level: info
logging.to_files: false
logging.to_stderr: true