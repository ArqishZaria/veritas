filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*-json.log'

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

  # A3: keep logs from the replicas (HTTP + gRPC, field replica.id) and from Envoy's JSON access log.
  - drop_event:
      when:
        not:
          or:
            - equals:
                service.name: "veritas-app"
            - equals:
                service.name: "veritas-grpc"
            - equals:
                service.name: "veritas-envoy"

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "veritas-logs-%{+yyyy.MM.dd}"

setup.template.name: "veritas-logs"
setup.template.pattern: "veritas-logs-*"
setup.ilm.enabled: false

logging.level: info
logging.to_files: false
logging.to_stderr: true
