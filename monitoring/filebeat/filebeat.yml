# ---------------------------------------------------------------------------
# Filebeat -- static file-glob input (no Docker events watch required)
# ---------------------------------------------------------------------------
# The label-based `filebeat.autodiscover` approach depends on a persistent
# "watch docker events" connection over the Docker socket. On Docker Desktop
# for Windows, that connection gets killed by the named-pipe proxy's idle
# timeout ("unexpected EOF" / "server closed idle connection"), which stops
# autodiscover from ever starting a harvester. This static input sidesteps
# the problem entirely: it just tails every container's json-file log
# directly off disk -- no Docker API calls, no persistent socket needed.
filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*-json.log'

# ---------------------------------------------------------------------------
# Processors
# ---------------------------------------------------------------------------
processors:
  # app/main.py's ECSJsonFormatter emits one complete ECS JSON document per
  # line. The `container` input type unwraps Docker's {"log":...,"stream":
  # ...,"time":...} wrapper automatically, exposing the raw app line as
  # `message`. This hoists its keys to the top level.
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

  # Because this input tails EVERY container's logs (not just veritas, since
  # we're no longer filtering by the co.elastic.logs/enabled label), drop
  # anything that isn't a genuine Veritas ECS log line. Only veritas-app's
  # logger ever populates service.name this way, so this reliably filters
  # out Elasticsearch/Kibana/Grafana/Prometheus's own log noise without
  # needing any Docker metadata lookup.
  - drop_event:
      when:
        not:
          equals:
            service.name: "veritas-app"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "veritas-logs-%{+yyyy.MM.dd}"

setup.template.name: "veritas-logs"
setup.template.pattern: "veritas-logs-*"
setup.ilm.enabled: false

logging.level: info
logging.to_files: false
logging.to_stderr: true