version: "3.9"

networks:
  veritas-net:
    driver: bridge

volumes:
  esdata:
    driver: local

services:

  # ------------------------------------------------------------------
  # APPLICATION
  # ------------------------------------------------------------------
  veritas:
    build: .
    container_name: veritas-app
    ports:
      - "8000:8000"
    environment:
      - SEED_DEMO_DATA=true
      - CARDINALITY_DEMO_USE_LABEL=true
    networks:
      - veritas-net
    labels:
      co.elastic.logs/enabled: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ------------------------------------------------------------------
  # METRICS: Prometheus + Node Exporter + Grafana
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: veritas-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - veritas-net
    depends_on:
      veritas:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: veritas-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - veritas-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: veritas-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - veritas-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ------------------------------------------------------------------
  # LOGGING: Elasticsearch + Filebeat + Kibana
  # ------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: veritas-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - veritas-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    container_name: veritas-filebeat
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["--strict.perms=false"]
    networks:
      - veritas-net
    depends_on:
      elasticsearch:
        condition: service_healthy
      veritas:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: veritas-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - veritas-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
