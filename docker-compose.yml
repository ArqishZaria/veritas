version: "3.9"

networks:
  veritas-net:
    driver: bridge
    ipam:
      config:
        # A3: replicas get fixed addresses (.11/.12/.13) so Envoy can use STATIC endpoints; Docker hands out
        # dynamic addresses only from ip_range (.128+), so they can never collide with the fixed ones.
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25

volumes:
  esdata:
    driver: local
  veritasdata:            # shared SQLite file (WAL): the single source of truth for ALL replicas, HTTP and gRPC
    driver: local

# ---------------------------------------------------------------------
# A3: three identical replicas. Each one serves HTTP (8000) AND gRPC (50051) from one process.
# ---------------------------------------------------------------------
x-replica-env: &replica-env
  VERITAS_DB_PATH: /data/veritas.db
  SERVICE_NAME: veritas-app
  ENABLE_GRPC: "true"
  GRPC_PORT: "50051"
  GRPC_MAX_WORKERS: "32"
  ENABLE_FAULT_INJECTION: "true"       # enables /internal/delay (A3 latency experiment) and the A2 fault hook
  INJECT_DELAY_MS: "0"
  CARDINALITY_DEMO_USE_LABEL: "false"
  RATE_LIMIT_BACKEND: db               # shared counters; "memory" = per-replica counters (see README-A3)
  LOGIN_RATE_LIMIT: "5"
  LOGIN_RATE_WINDOW: "60"

x-replica: &replica
  build: .
  image: veritas-app:a3
  volumes:
    - veritasdata:/data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s
  labels:
    co.elastic.logs/enabled: "true"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:

  veritas-a:                              # owns schema creation + demo seeding
    <<: *replica
    container_name: veritas-a
    environment:
      <<: *replica-env
      REPLICA_ID: A
      SEED_DEMO_DATA: "true"
    ports: ["8001:8000", "50061:50051"]   # direct access (bypasses Envoy): HTTP / gRPC
    networks:
      veritas-net:
        ipv4_address: 172.28.0.11

  veritas-b:
    <<: *replica
    container_name: veritas-b
    environment:
      <<: *replica-env
      REPLICA_ID: B
      SEED_DEMO_DATA: "false"
    ports: ["8002:8000", "50062:50051"]
    depends_on:
      veritas-a:
        condition: service_healthy
    networks:
      veritas-net:
        ipv4_address: 172.28.0.12

  veritas-c:
    <<: *replica
    container_name: veritas-c
    environment:
      <<: *replica-env
      REPLICA_ID: C
      SEED_DEMO_DATA: "false"
    ports: ["8003:8000", "50063:50051"]
    depends_on:
      veritas-a:
        condition: service_healthy
    networks:
      veritas-net:
        ipv4_address: 172.28.0.13

  # ------------------------------------------------------------------
  # ENVOY: HTTP listener 8000 and gRPC listener 50051 (host ports), admin/metrics on 9901.
  # Scenario = which generated file in ./envoy is loaded: python scripts/scenario.py <name>  (writes .env)
  # ------------------------------------------------------------------
  envoy:
    image: envoyproxy/envoy:v1.31.0
    container_name: veritas-envoy
    # --concurrency 1: one worker thread => one round-robin sequence for all connections (exact, repeatable shares)
    command: ["-c", "/etc/envoy/${ENVOY_SCENARIO:-a-only}.yaml", "--concurrency", "1", "--log-level", "warn"]
    volumes:
      - ./envoy:/etc/envoy:ro
    ports:
      - "8000:8080"       # HTTP via Envoy (the old app port)
      - "50051:50051"     # gRPC via Envoy
      - "9901:9901"       # Envoy admin + /stats/prometheus
    networks:
      - veritas-net
    depends_on:
      veritas-a:
        condition: service_healthy
      veritas-b:
        condition: service_healthy
      veritas-c:
        condition: service_healthy
    labels:
      co.elastic.logs/enabled: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ------------------------------------------------------------------
  # METRICS: Prometheus + Node Exporter + Grafana
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: veritas-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - veritas-net
    depends_on:
      veritas-a:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: veritas-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - veritas-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: veritas-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - veritas-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ------------------------------------------------------------------
  # LOGGING: Elasticsearch + Filebeat + Kibana
  # ------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: veritas-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - veritas-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    container_name: veritas-filebeat
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["--strict.perms=false"]
    networks:
      - veritas-net
    depends_on:
      elasticsearch:
        condition: service_healthy
      veritas-a:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: veritas-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - veritas-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
